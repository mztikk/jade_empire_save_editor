# German catalog for JadeForge.
#
# Keys are stable semantic ids, not English sentences. Translate the value on
# the right. Every id needs a non-empty, placeholder-compatible value before
# this catalog can be selected as the interface language.
#
# Placeholders such as {name} must match en.toml exactly. Product and technical
# names stay unchanged; game terms should follow the German game release
# (Kampfstil, Essenzjuwel, Amulett, Gefährte, Fokus; Chi stays Chi).
#
# Verify that every value is present with:
#   cargo test -p jadeforge-i18n --lib every_german_value_is_filled

complete = true

