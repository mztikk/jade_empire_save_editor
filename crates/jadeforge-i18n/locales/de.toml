# German preview catalog for JadeForge.
#
# Keys are stable semantic ids, not English sentences. Translate the value on
# the right. `complete = false` keeps this catalog in preview: empty values
# render as ⟦id⟧ markers and the language is not selected from the environment.
# Set `complete = true` only when every id has a non-empty, placeholder-compatible
# value.
#
# Placeholders such as {name} must match en.toml exactly. Product and technical
# names stay unchanged; game terms should follow the German game release
# (Kampfstil, Edelstein, Amulett, Gefährte, Fokus; Chi stays Chi).
#
# List remaining empty ids with:
#   cargo test -p jadeforge-i18n --lib every_german_value_is_filled -- --ignored

complete = false

