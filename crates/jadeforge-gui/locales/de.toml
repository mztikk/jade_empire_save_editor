# Overview tab
# src/views/overview.rs
"A timestamped backup is created next to the savegame on every save and shown here." = "Ein Backup mit Zeitstempel wird bei jedem Speichern neben dem Spielstand erstellt und hier angezeigt."
"At a glance" = "Auf einen Blick"
"Backup" = "Backup"
"CHI" = "CHI"
"Contents" = "Inhalt"
"FOCUS" = "FOCUS"
"File" = "Datei"
"GOLD" = "Gold"
"Game data" = "Spieldaten"
"HEALTH" = "Gesundheit"
"JadeForge verifies every savegame by re-reading it before writing, writes it atomically and keeps a timestamped backup next to the file." = "JadeForge überprüft jeden Spielstand, indem es ihn vor dem Schreiben erneut list, alle Schreibvorgänge atomar ausführt und ein Backup mit Zeitstempel neben der Datei speichert."
"Savegame" = "Spielstand"
"This is the file as it was before the last save. To restore it, close JadeForge and copy the backup over save.sac." = "Die Datei, wie sie vor dem letzten Speichern war. Um sie wiederherzustellen, schließen Sie JadeForge und kopieren Sie das Backup über save.sac."

# Character tab
# src/views/character.rs
"Attribute points you can still spend; the field is created when the savegame does not have it." = "Attributpunkte, die Sie noch ausgeben können; das Feld wird erstellt, wenn der Spielstand es nicht hat."
"Attributes" = "Attribute"
"Current sheet" = "Aktuelles Datenblatt"
"Current values may stay below the maximum; the game fills them on rest." = "Aktuelle Werte können unter dem Maximum bleiben; das Spiel füllt sie beim Ruhen auf."
"Gold is optional in the savegame: leave it empty to keep the field absent, or enter a value to create it when you save." = "Gold ist optional im Spielstand: Lassen Sie es leer, um das Feld zu entfernen, oder geben Sie einen Wert ein, um es zu erstellen, wenn Sie speichern."
"Identity" = "Identität"
"Level" = "Level"
"Name" = "Name"
"Time played" = "Gespielte Zeit"
"Vitals" = "Vitalwerte"
"not set" = "nicht gesetzt"

# Styles tab
# src/views/styles.rs
"A new style is stored with the same field layout as one the player already owns; the game fills in the remaining data from its own tables." = "Ein neuer Stil wird mit demselben Feldlayout wie ein bereits vorhandener Stil des Spielers gespeichert; das Spiel füllt die restlichen Daten aus seinen eigenen Tabellen."
"Bundled English names are loaded, but new styles and upgrade details still need the game data. Levels, weapons and time spent come from the savegame." = "Mitgelieferte englische Namen werden geladen, aber neue Stile und Upgrade-Details benötigen weiterhin die Spieldaten. Level, Waffen und verbrachte Zeit stammen aus dem Spielstand."
"Clear the style filter" = "Stil-Filter löschen"
"Fighting styles" = "Kampfstile"
"Filled gold orbs are owned; an empty ring is available. Clicking tier N buys every missing tier up to N; clicking an owned tier removes it and everything above it." = "Gefüllte goldene Orbs sind gelernt; ein leerer Ring ist noch verfügbar. Klicken Sie auf Stufe N, um jede fehlende Stufe bis N zu kaufen; Klicken Sie auf eine vorhandene Stufe, um sie und alles darüber zu entfernen."
"LEARN A STYLE" = "EINEN STIL LERNEN"
"Reading the game data; learned styles can already be inspected and removed." = "Die Spieldaten werden gelesen; gelernte Stile können bereits überprüft und entfernt werden."
"The game data was not found, so style names and new styles are unavailable. Levels, weapons and time spent come from the savegame." = "Die Spieldaten wurden nicht gefunden, daher sind Stilnamen und neue Stile nicht verfügbar. Level, Waffen und verbrachte Zeit stammen aus dem Spielstand."
"The player has not learned any fighting styles." = "Der Spieler hat noch keine Kampfstile gelernt."
"UPGRADES" = "VERBESSERUNGEN"

# Inventory tab
# src/views/inventory.rs
"ADD AN ITEM" = "EINEN GEGENSTAND HINZUFÜGEN"
"CATEGORY" = "KATEGORIE"
"Clear the item database filter" = "Gegenstand-Filter löschen"
"Reading the game data; existing items can already be edited and removed." = "Die Spieldaten werden gelesen; bestehende Gegenstände können bereits bearbeitet und entfernt werden."
"The game data was not found, so items can only be removed, not added. The category comes from the item type stored in the savegame." = "Die Spieldaten wurden nicht gefunden, daher können Gegenstände nur entfernt, aber nicht hinzugefügt werden. Die Kategorie stammt vom Gegenstandstyp, der im Spielstand gespeichert ist."
"The inventory is empty." = "Das Inventar ist leer."

# Gems tab
# src/views/gems.rs
"Add a gem" = "Einen Edelstein hinzufügen"
"Amulet" = "Amulett"
"Clear the gem filter" = "Edelstein-Filter löschen"
"Moving a gem keeps its effects; JadeForge only changes which list references it." = "Das Verschieben eines Edelsteins behält seine Effekte bei; JadeForge ändert nur, welche Liste darauf verweist."
"No gems carried in the inventory." = "Keine Edelsteine im Inventar."
"No gems socketed into the amulet." = "Keine Edelsteine im Amulett."
"The amulet is unlocked early in the story; it has no sockets before that." = "Das Amulett wird zu Beginn freigeschaltet; es hat keine Sockel vorher."

# Companions tab
# src/views/henchmen.rs
"Companion levels follow the player through the game; raising them here only changes what the companion starts with." = "Gefährten-Level folgen dem Spieler durch das Spiel; sie hier zu erhöhen, ändert nur, womit der Gefährte startet."
"This savegame has no companions yet. They appear here once the story introduces them." = "Dieser Spielstand hat noch keine Gefährten. Sie erscheinen hier, sobald die Geschichte sie einführt."
"available" = "verfügbar"
"hidden" = "versteckt"

# Backups page
# src/views/backups.rs
"Back to editing" = "Zurück zum Bearbeiten"
"Close the backup browser" = "Backup-Browser schließen"
"No backups were found next to this savegame. The first successful save creates one." = "Keine Backups wurden neben diesem Spielstand gefunden. Der erste erfolgreiche Speichervorgang erstellt eines."
"Restore" = "Wiederherstellen"
"Save or revert the unsaved changes before restoring a backup: a restore would otherwise silently discard them." = "Speichern oder rückgängig machen der ungespeicherten Änderungen vor dem Wiederherstellen eines Backups: eine Wiederherstellung würde die Änderungen sonst verwerfen."

# Review-before-save page
# src/views/review.rs
"Nothing is written until the write button below is pressed. The file is verified by re-reading it, written atomically, and the previous file is kept as a backup. Invalid character fields are not applied; the other edits are." = "Nichts wird geschrieben, bis die Schaltfläche unten zum Schreiben gedrückt wird. Die Datei wird durch erneutes Lesen überprüft, atomar geschrieben und die vorherige Datei als Backup aufbewahrt. Ungültige Charakterfelder werden nicht angewendet; die anderen Bearbeitungen werden übernommen."
"Review changes" = "Änderungen überprüfen"
"Write savegame" = "Spielstand schreiben"

# About, settings and diagnostics
# src/views/about.rs
"APPEARANCE" = "ANSICHT"
"About JadeForge" = "Über JadeForge"
"BACKUPS" = "BACKUPS"
"Close" = "Schließen"
"Close the About page" = "Überblicksseite schließen"
"Copy diagnostics" = "Diagnose kopieren"
"Copy the diagnostics to the clipboard" = "Diagnose in die Zwischenablage kopieren"
"DIAGNOSTICS" = "DIAGNOSE"
"Every save writes a copy of the previous save.sac next to it, named save.sac.jadeforge-backup-<seconds>.<nanos>.<counter>. To undo a save, close JadeForge and copy the backup over save.sac. An earlier backup is never overwritten." = "Jeder Speichervorgang erstellt eine Kopie der vorherigen save.sac Datei, benannt als save.sac.jadeforge-backup-<Sekunden>.<Nanosekunden>.<Zähler>. Um einen Speichervorgang rückgängig zu machen, schließen Sie JadeForge und kopieren Sie das Backup über save.sac. Ein früheres Backup wird niemals überschrieben."
"Jade Empire savegame editor" = "Jade Empire Spielstand-Editor"
"JadeForge reads and writes save.sac files directly. Every write is verified by re-reading the produced file and is written atomically, and the game installation is only ever read." = "JadeForge liest und schreibt save.sac Dateien direkt. Jeder Schreibvorgang wird durch erneutes Lesen der erzeugten Datei überprüft und atomar geschrieben. Die Spielinstallation wird nur gelesen."
"KEYBOARD SHORTCUTS" = "Tastenkombinationen"
"LANGUAGE" = "SPRACHE"
"LICENSES" = "LIZENZEN"
"No backup has been written in this session; saving a change creates one and shows its exact path on the Overview tab." = "Kein Backup wurde in dieser Sitzung geschrieben; das Speichern einer Änderung erstellt eines und zeigt seinen genauen Pfad auf der Übersichtsseite an."
"No config directory is available in this environment. JADEFORGE_CONFIG_DIR can point at one for portable installs." = "Kein Konfigurationsverzeichnis ist in dieser Umgebung verfügbar. JADEFORGE_CONFIG_DIR kann auf eines für portable Installationen verweisen."
"No save folder has been chosen yet. Use Browse… or Ctrl+O to pick one." = "Es wurde noch kein Spielstand-Ordner ausgewählt. Verwenden Sie Durchsuchen… oder Strg+O, um einen auszuwählen."
"Remember size and position" = "Größe und Position merken"
"Remember the window size and position between runs" = "Fenstergröße und -position zwischen Starts merken"
"Remember the window size between runs; the compositor places the window" = "Fenstergröße zwischen Starts merken; der Compositor platziert das Fenster"
"SETTINGS" = "EINSTELLUNGEN"
"Sort order" = "Sotierreihenfolge"
"TEXT SIZE" = "TEXTGRÖSSE"
"THEME" = "THEME"
"The theme and text size apply immediately and are remembered in the settings file. System follows the operating system preference; high contrast can be selected here because the windowing layer does not report the platform's forced-colours setting." = "Das Theme und die Textgröße werden sofort angewendet und in der Einstellungsdatei gespeichert. System folgt der Betriebssystempräferenz; hoher Kontrast kann hier ausgewählt werden, da die Fensterschicht die erzwungene Farbgebungseinstellung der Plattform nicht meldet."
"These preferences live in one TOML file. They are remembered between runs and can be edited while JadeForge is closed." = "Diese Einstellungen befinden sich in einer TOML-Datei. Sie werden zwischen den Starts gespeichert und können bearbeitet werden, während JadeForge geschlossen ist."
"WINDOW" = "FENSTER"
"Wayland compositors place windows themselves. Add a window rule in your desktop settings to pin the position." = "Wayland-Compositoren platzieren Fenster selbst. Fügen Sie in Ihren Desktop-Einstellungen eine Fensterregel hinzu, um die Position zu fixieren."

