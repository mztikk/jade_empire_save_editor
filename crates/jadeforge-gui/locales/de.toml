# German interface strings for JadeForge.
#
# Keys are the exact English source strings used by `t("...")`; do not change
# them. Translate the value on the right of each key. An empty value falls back
# to English, so this file can be filled in progressively.
#
# Keep product and technical names unchanged (JadeForge, Jade Empire, KDE,
# Wayland, TOML, save.sac, dialog.tlk, Ctrl+S, ...). Prefer the German terms
# the game uses where they exist: Kampfstil (style), Edelstein (gem), Amulett
# (amulet), Gefährte (companion), Fokus (focus); Chi stays Chi.
#
# Check coverage with:
#   cargo test -p jadeforge-gui --lib every_german_value_is_filled -- --ignored

