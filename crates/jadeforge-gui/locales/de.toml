"Restore" = "Wiederherstellen"
"Save or revert the unsaved changes before restoring a backup: a restore would otherwise silently discard them." = "Speichern oder rückgängig machen der ungespeicherten Änderungen vor dem Wiederherstellen eines Backups: eine Wiederherstellung würde die Änderungen sonst verwerfen."

# Review-before-save page
# src/views/review.rs
"Nothing is written until the write button below is pressed. The file is verified by re-reading it, written atomically, and the previous file is kept as a backup. Invalid character fields are not applied; the other edits are." = "Nichts wird geschrieben, bis die Schaltfläche unten zum Schreiben gedrückt wird. Die Datei wird durch erneutes Lesen überprüft, atomar geschrieben und die vorherige Datei als Backup aufbewahrt. Ungültige Charakterfelder werden nicht angewendet; die anderen Bearbeitungen werden übernommen."
"Review changes" = "Änderungen überprüfen"
"Write savegame" = "Spielstand schreiben"

# About, settings and diagnostics
# src/views/about.rs
"APPEARANCE" = "ANSICHT"
"About JadeForge" = "Über JadeForge"
"BACKUPS" = "BACKUPS"
"Close" = "Schließen"
"Close the About page" = "Überblicksseite schließen"
"Copy diagnostics" = "Diagnose kopieren"
"Copy the diagnostics to the clipboard" = "Diagnose in die Zwischenablage kopieren"
"DIAGNOSTICS" = "DIAGNOSE"
"Every save writes a copy of the previous save.sac next to it, named save.sac.jadeforge-backup-<seconds>.<nanos>.<counter>. To undo a save, close JadeForge and copy the backup over save.sac. An earlier backup is never overwritten." = "Jeder Speichervorgang erstellt eine Kopie der vorherigen save.sac Datei, benannt als save.sac.jadeforge-backup-<Sekunden>.<Nanosekunden>.<Zähler>. Um einen Speichervorgang rückgängig zu machen, schließen Sie JadeForge und kopieren Sie das Backup über save.sac. Ein früheres Backup wird niemals überschrieben."
"Jade Empire savegame editor" = "Jade Empire Spielstand-Editor"
"JadeForge reads and writes save.sac files directly. Every write is verified by re-reading the produced file and is written atomically, and the game installation is only ever read." = "JadeForge liest und schreibt save.sac Dateien direkt. Jeder Schreibvorgang wird durch erneutes Lesen der erzeugten Datei überprüft und atomar geschrieben. Die Spielinstallation wird nur gelesen."
"KEYBOARD SHORTCUTS" = "Tastenkombinationen"
"LANGUAGE" = "SPRACHE"
"LICENSES" = "LIZENZEN"
"No backup has been written in this session; saving a change creates one and shows its exact path on the Overview tab." = "Kein Backup wurde in dieser Sitzung geschrieben; das Speichern einer Änderung erstellt eines und zeigt seinen genauen Pfad auf der Übersichtsseite an."
"No config directory is available in this environment. JADEFORGE_CONFIG_DIR can point at one for portable installs." = "Kein Konfigurationsverzeichnis ist in dieser Umgebung verfügbar. JADEFORGE_CONFIG_DIR kann auf eines für portable Installationen verweisen."
"No save folder has been chosen yet. Use Browse… or Ctrl+O to pick one." = "Es wurde noch kein Spielstand-Ordner ausgewählt. Verwenden Sie Durchsuchen… oder Strg+O, um einen auszuwählen."
"Remember size and position" = "Größe und Position merken"
"Remember the window size and position between runs" = "Fenstergröße und -position zwischen Starts merken"
"Remember the window size between runs; the compositor places the window" = "Fenstergröße zwischen Starts merken; der Compositor platziert das Fenster"
"SETTINGS" = "EINSTELLUNGEN"
"Sort order" = "Sotierreihenfolge"
"TEXT SIZE" = "TEXTGRÖSSE"
"THEME" = "THEME"
"The theme and text size apply immediately and are remembered in the settings file. System follows the operating system preference; high contrast can be selected here because the windowing layer does not report the platform's forced-colours setting." = "Das Theme und die Textgröße werden sofort angewendet und in der Einstellungsdatei gespeichert. System folgt der Betriebssystempräferenz; hoher Kontrast kann hier ausgewählt werden, da die Fensterschicht die erzwungene Farbgebungseinstellung der Plattform nicht meldet."
"These preferences live in one TOML file. They are remembered between runs and can be edited while JadeForge is closed." = "Diese Einstellungen befinden sich in einer TOML-Datei. Sie werden zwischen den Starts gespeichert und können bearbeitet werden, während JadeForge geschlossen ist."
"WINDOW" = "FENSTER"
"Wayland compositors place windows themselves. Add a window rule in your desktop settings to pin the position." = "Wayland-Compositoren platzieren Fenster selbst. Fügen Sie in Ihren Desktop-Einstellungen eine Fensterregel hinzu, um die Position zu fixieren."

