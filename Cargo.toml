[workspace]
resolver = "3"
members = [
    "crates/jadeforge-core",
    "crates/jadeforge-session",
    "crates/jadeforge-cli",
    "crates/jadeforge-gui",
    "crates/jadeforge-gamedata",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Nils Feierabend <mztikk@outlook.de>"]
license = "MIT"
repository = "https://github.com/mztikk/jade_empire_save_editor"
homepage = "https://github.com/mztikk/jade_empire_save_editor"
readme = "README.md"

[workspace.dependencies]
jadeforge-core = { path = "crates/jadeforge-core", version = "0.1.0" }
jadeforge-session = { path = "crates/jadeforge-session", version = "0.1.0" }
jadeforge-gamedata = { path = "crates/jadeforge-gamedata", version = "0.1.0" }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
freya = { version = "0.4", default-features = true }
rfd = { version = "0.17", default-features = true }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Correctness lints that are already clean; keep them that way.
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"

# Format code narrows values on purpose; the conversions are checked by tests.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Distribution builds produced by `just publish`: release optimisation with fat
# LTO over the whole dependency graph. The release profile keeps thin LTO so
# that `cargo build --release` stays usable during development.
[profile.dist]
inherits = "release"
lto = "fat"

[profile.dev.package."*"]
opt-level = 1
