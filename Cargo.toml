[workspace]
resolver = "3"
members = [
    "crates/jadeforge-core",
    "crates/jadeforge-cli",
    "crates/jadeforge-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Nils Feierabend <mztikk@outlook.de>"]
license = "MIT"
repository = "https://github.com/mztikk/jade_empire_save_editor"
homepage = "https://github.com/mztikk/jade_empire_save_editor"
readme = "README.md"

[workspace.dependencies]
jadeforge-core = { path = "crates/jadeforge-core", version = "0.1.0" }
thiserror = "2.0"
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
freya = "0.4"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 1
