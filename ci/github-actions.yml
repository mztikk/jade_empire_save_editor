name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  core:
    name: gff, core, session and cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p jadeforge-gff -p jadeforge-core -p jadeforge-session -p jadeforge-cli --all-targets
      - name: Clippy
        run: cargo clippy -p jadeforge-gff -p jadeforge-core -p jadeforge-session -p jadeforge-cli --all-targets -- -D warnings

  gui:
    name: gui (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxkbcommon-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Headless UI tests
        run: cargo test -p jadeforge-gui
      - name: Clippy
        run: cargo clippy -p jadeforge-gui --all-targets -- -D warnings

  publish:
    name: publish (${{ matrix.os }})
    # The three fat-LTO builds are expensive; pull requests are covered by the
    # jobs above. Push to main, tag, or use the manual dispatch to get binaries.
    if: github.event_name != 'pull_request'
    needs: [formatting, core, gui]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Skia statically links ICU, while accesskit_windows imports the system
      # icuuc.dll through the windows crate; the symbols collide. Remove this
      # once the dependency no longer pulls in Win32_Globalization.
      RUSTFLAGS: ${{ startsWith(matrix.os, 'windows') && '-C link-arg=/FORCE:MULTIPLE' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Put Git Bash on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "$env:ProgramFiles\Git\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:ProgramFiles\Git\usr\bin"
      - name: Install GUI system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxkbcommon-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - name: Build fat-LTO binaries
        run: just publish
      - name: Headless UI tests
        if: runner.os != 'Linux'
        run: cargo test -p jadeforge-gui
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: jadeforge-${{ runner.os }}
          path: dist/
          if-no-files-found: error
